<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="Inicio">
      <span class="brand-mark">N</span>
      <span class="brand-name">NEXO<small>INVENTARIO</small></span>
    </a>

    <div class="nav-caption">GESTIÓN</div>
    <nav aria-label="Navegación principal">
      <button
        type="button"
        class="nav-link"
        [class.active]="seccion() === 'productos'"
        (click)="seccion.set('productos')"
      >
        <span class="nav-icon">▦</span>
        <span>Productos</span>
      </button>
      <button
        type="button"
        class="nav-link"
        [class.active]="seccion() === 'categorias'"
        (click)="seccion.set('categorias')"
      >
        <span class="nav-icon">◈</span>
        <span>Categorías</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <span class="status-dot"></span>
      <span>API conectada localmente</span>
    </div>
  </aside>

  <main class="main-area">
    <header class="topbar">
      <div class="breadcrumb">Panel de control <span>/</span> {{ seccion() === 'productos' ? 'Productos' : 'Categorías' }}</div>
      <div class="profile">
        <span class="profile-avatar">A</span>
        <span>Administrador</span>
      </div>
    </header>

    <div class="page-content">
      @if (seccion() === 'productos') {
        <app-productos />
      } @else {
        <app-categorias />
      }
      <footer>Gestión de inventario <span>·</span> API de productos y categorías</footer>
    </div>
  </main>
</div>
